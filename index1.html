<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="#">
                <i class="fas fa-check-circle"></i> MyTasks
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="daily.html">Daily</a></li>
                    <li class="nav-item"><a class="nav-link" href="weekly.html">Weekly</a></li>
                    <li class="nav-item"><a class="nav-link" href="monthly.html">Monthly</a></li>
                    <li class="nav-item"><a class="nav-link" href="comp.html">Completed</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="card shadow-lg p-4 rounded-4 mt-4">

        <h5 class="text-center mb-3 text-primary">Add Task</h5>

        <input class="form-control mb-3" placeholder="What do you want to do?" id="task">

        <div class="row g-2">
            <div class="col-md-4">
                <input type="date" id="date" class="form-control">
            </div>
            <div class="col-md-4">
                <input type="time" id="time" class="form-control">
            </div>
            <div class="col-md-4">
                <select id="duration" class="form-control">
                    <option disabled selected>Duration</option>
                    <option>Daily</option>
                    <option>Weekly</option>
                    <option>Monthly</option>
                </select>
            </div>
        </div>

        <button id="add" class="btn btn-primary w-100 mt-3">
            <i class="fas fa-plus"></i> Add Task
        </button>

    </div>

    <h5 class="mt-4 text-white text-center">Your Tasks</h5>
    <div id="all-tasks"></div>

    <script src="task.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
